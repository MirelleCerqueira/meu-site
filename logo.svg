<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 152" width="640" height="152">

  <!-- Fundo branco -->
  <rect width="640" height="152" fill="white"/>

  <!-- ── Balão de pensamento ── -->
  <!-- Bolinha pequena -->
  <circle cx="64" cy="53" r="4" fill="#5ECFC0"/>
  <!-- Bolinha média -->
  <circle cx="75" cy="41" r="6.5" fill="#5ECFC0"/>
  <!-- Balão principal -->
  <ellipse cx="92" cy="22" rx="26" ry="17" fill="#5ECFC0"/>

  <!-- ── Engrenagem (centro: 52, 88) ── -->
  <!-- 8 dentes calculados com R_outer=38, R_inner=28 -->
  <g transform="translate(52,88)">
    <path d="
      M 27.4,-5.8
      L 37.6,-5.3  L 37.6,5.3   L 27.4,5.8
      A 28,28 0 0,1 23.5,15.3
      L 30.4,22.9  L 22.9,30.4  L 15.3,23.5
      A 28,28 0 0,1 5.8,27.4
      L 5.3,37.6   L -5.3,37.6  L -5.8,27.4
      A 28,28 0 0,1 -15.3,23.5
      L -22.9,30.4 L -30.4,22.9 L -23.5,15.3
      A 28,28 0 0,1 -27.4,5.8
      L -37.6,5.3  L -37.6,-5.3 L -27.4,-5.8
      A 28,28 0 0,1 -23.5,-15.3
      L -30.4,-22.9 L -22.9,-30.4 L -15.3,-23.5
      A 28,28 0 0,1 -5.8,-27.4
      L -5.3,-37.6  L 5.3,-37.6  L 5.8,-27.4
      A 28,28 0 0,1 15.3,-23.5
      L 22.9,-30.4  L 30.4,-22.9 L 23.5,-15.3
      A 28,28 0 0,1 27.4,-5.8 Z
    "
    fill="none" stroke="#2A8075" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Buraco central -->
    <circle cx="0" cy="0" r="11.5" fill="none" stroke="#2A8075" stroke-width="3.2"/>
  </g>

  <!-- ── Linha separadora ── -->
  <line x1="118" y1="26" x2="118" y2="132" stroke="#CCDBDA" stroke-width="1.5"/>

  <!-- ── Texto: Integra (negrito escuro) + lmente (fino teal) ── -->
  <text x="134" y="98"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="52"
        letter-spacing="-1">
    <tspan font-weight="800" fill="#1A1A1A">Integra</tspan><tspan font-weight="300" fill="#2A8075">lmente</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text x="136" y="122"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13"
        font-weight="400"
        fill="#8A9A98"
        letter-spacing="3.2">saúde e segurança no trabalho</text>

</svg>
