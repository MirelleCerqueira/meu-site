<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integralmente 💭</title>
    <meta name="description" content="Saúde e Segurança no Trabalho — Links da Integralmente SST">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0D1F1C 0%, #0A1714 55%, #112030 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 32px 20px;
        }

        /* Bolas decorativas de fundo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(94,207,192,0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(42,128,117,0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* ── AVATAR / ÍCONE ── */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2A8075, #1C6058);
            border: 3px solid rgba(94,207,192,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            margin-bottom: 4px;
            box-shadow: 0 8px 32px rgba(94,207,192,0.25);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-6px); }
        }

        /* ── NOME ── */
        .name {
            font-size: 1.9rem;
            font-weight: 300;
            color: white;
            letter-spacing: -0.01em;
            text-align: center;
        }
        .name strong {
            font-weight: 800;
        }
        .name .mente {
            color: #5ECFC0;
            font-weight: 300;
        }

        .tagline {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.12em;
            text-transform: lowercase;
            text-align: center;
            margin-bottom: 8px;
        }

        /* ── LINKS ── */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .link-btn:active {
            transform: scale(0.97);
        }

        .link-btn .btn-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .link-btn .btn-label {
            flex: 1;
        }

        .link-btn .btn-arrow {
            font-size: 0.9rem;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
        }

        .link-btn:hover .btn-arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Site */
        .btn-site {
            background: linear-gradient(135deg, #2A8075, #1C6058);
            border-color: rgba(94,207,192,0.3);
            box-shadow: 0 4px 20px rgba(42,128,117,0.35);
        }
        .btn-site:hover {
            background: linear-gradient(135deg, #32957A, #22705E);
            box-shadow: 0 6px 28px rgba(42,128,117,0.5);
            transform: translateY(-2px);
        }

        /* WhatsApp */
        .btn-whatsapp {
            background: linear-gradient(135deg, #1DA851, #128C3E);
            border-color: rgba(37,211,102,0.3);
            box-shadow: 0 4px 20px rgba(37,211,102,0.25);
        }
        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #22C25D, #159945);
            box-shadow: 0 6px 28px rgba(37,211,102,0.4);
            transform: translateY(-2px);
        }

        /* E-mail */
        .btn-email {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.15);
        }
        .btn-email:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Instagram */
        .btn-instagram {
            background: linear-gradient(135deg, #833AB4, #C13584, #E1306C, #F77737);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 4px 20px rgba(193,53,132,0.25);
        }
        .btn-instagram:hover {
            box-shadow: 0 6px 28px rgba(193,53,132,0.4);
            transform: translateY(-2px);
        }

        /* ── DIVIDER ── */
        .divider {
            width: 48px;
            height: 1px;
            background: rgba(255,255,255,0.12);
            margin: 4px 0;
        }

        /* ── BADGE LEGAL ── */
        .legal-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .badge {
            background: rgba(94,207,192,0.1);
            border: 1px solid rgba(94,207,192,0.2);
            color: rgba(255,255,255,0.5);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 100px;
            letter-spacing: 0.04em;
        }

        /* ── FOOTER ── */
        .footer {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.2);
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
